name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # The acceptance run on a real machine is started by hand: it pulls the Maven
  # image, provisions a local repository of a few hundred MB, and runs the full
  # gates six times. On every pull request it would turn a 25-second check into
  # ten or twenty minutes, and the question it answers (does mvn -o in the
  # sandbox really produce those reports?) doesn't change from one change to the
  # next.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests bench

      - name: Mypy
        run: mypy

      # Which files coverage measures is decided by source in pyproject.toml's
      # [tool.coverage.run]: writing --cov=honest_ci on the command line would
      # override it.
      - name: Tests
        run: pytest -q --cov --cov-report=term-missing --cov-fail-under=75

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Runs the gitleaks binary directly rather than gitleaks-action: the action
      # needs a paid license for an organization's repositories, and without one
      # it exits before the scan starts. That is "the tool didn't run", not "no
      # secrets". The binary itself is MIT-licensed, free for organizations too.
      # The version is pinned and its sha256 checked: this binary is the gate that
      # guards the credentials, and it must not become a supply-chain gap itself.
      - name: Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o "$tmp/$tarball" "$base/$tarball"
          curl -sSfL -o "$tmp/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$tmp" && grep " $tarball\$" checksums.txt | sha256sum -c -)
          tar -xzf "$tmp/$tarball" -C "$tmp" gitleaks
          # Scans the whole git history (fetch-depth: 0 above). --redact: a hit
          # doesn't echo the secret itself into the log. The configuration is
          # .gitleaks.toml at the repository root; a hit exits non-zero and this
          # step fails.
          "$tmp/gitleaks" git . --redact --no-banner --verbose

  # Runs only on workflow_dispatch: on pull requests and pushes it is skipped
  # entirely, takes no CI time, and can't fail a sound pull request because a
  # public runner's network hiccuped.
  acceptance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # make acceptance runs docker pull first, then the tests. pytest's docker
      # marker is excluded by addopts by default, so this is the only place those
      # tests run. Without a daemon they are skipped, and ubuntu-latest comes with
      # Docker: if they really are skipped, the environment has changed, and
      # someone should take a look.
      - name: Acceptance (Docker + Maven)
        run: make acceptance
