# Publishes honest-ci to PyPI when a release is published on GitHub.
#
# Trusted publishing: PyPI accepts the upload because it trusts this workflow
# in this repository, through a short-lived OIDC token, so no PyPI token is
# stored anywhere. Before the first release, register the publisher on PyPI:
# owner ChrisShips, repository honest-ci, workflow release.yml, environment
# pypi. https://docs.pypi.org/trusted-publishers/
name: release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  # Built in a job of its own, which cannot mint the OIDC token: the build runs
  # setuptools and whatever it pulls in, and none of that needs to be able to
  # publish.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The workflow that honest-ci init writes pins the Action to the tag
      # v<version>. A release whose tag and package version differ would put
      # one version on PyPI and have the workflow run another.
      - name: Check the tag against the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error title=release::The release tag is $TAG, but pyproject.toml says $version. Tag the release v$version."
            exit 1
          fi

      - name: Build the sdist and the wheel
        run: |
          python -m pip install --quiet --disable-pip-version-check build==1.6.1
          python -m build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # A deployment environment, so that publishing can be made to wait for a
    # person in the repository's settings, and PyPI can require this name.
    environment:
      name: pypi
      url: https://pypi.org/project/honest-ci/
    permissions:
      id-token: write  # the OIDC token PyPI checks, and nothing else
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
