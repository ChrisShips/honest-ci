# The demo shop's rule library.
#
# Every rule here is decided by deterministic code, from the diff alone:
# regular expressions, paths and test-integrity checks. Two kinds are left out
# on purpose.
#
# - Scanner rules (kind = "tool"). A scanner runs in the Docker sandbox, and
#   the GitHub Action does not install one; a scanner that is not there fails
#   closed, which blocks every change. Without them the demo needs no Docker
#   and runs all four scenarios in seconds.
# - Judgment rules (kind = "judgment"). They need a model. Without one they are
#   recorded as not reviewed and the change goes to a person, so the clean
#   scenario could never be mergeable -- for a reason that has nothing to do
#   with the change. honest-ci-rules.example.toml at the repository root shows
#   how to write them.

# The version goes into the fingerprint: change a rule, raise it, and earlier
# approvals stop applying.
version = "v1"

# ── Regular expressions, matched on the lines a change adds ──────────
[[rule]]
id = "R-01"
title = "Money stays in integer cents"
detail = """
Prices, discounts and shipping are integer cents. A float, or a round() of one,
loses a cent here and there, and nobody finds out until the books do not balance.
"""
severity = "high"
kind = "regex"
pattern = '\b(?:float|round)\s*\('
paths = ["src/**/*.py"]
fix = "Keep the arithmetic in integers, the way discounted() rounds half a cent up."

# ── Paths: touching one is the finding ───────────────────────────────
[[rule]]
id = "R-10"
title = "Generated code is not edited by hand"
detail = "The next generator run overwrites a hand edit; change the generator instead."
severity = "high"
kind = "path"
paths = ["**/generated/**"]

# ── Test integrity, read off the diff ────────────────────────────────
# These read the lines a change removes as well as the ones it adds: deleting
# the failing test leaves no added line for a regular expression to match.
# A hit is a fact about the diff. Removing a feature together with its tests is
# a deleted_test hit too, so the default action holds the change for a person
# rather than blocking it, and the person decides.
[[rule]]
id = "I-01"
title = "Tests do not disappear"
kind = "integrity"
check = "deleted_test"
fix = "Keep the test, or say in the change why it no longer applies."

[[rule]]
id = "I-02"
title = "No new skipped or focused tests"
kind = "integrity"
check = "skip_or_focus"
fix = "Fix what the test found, or say in the change why it cannot run."

[[rule]]
id = "I-03"
title = "Assertions do not quietly go away"
kind = "integrity"
check = "fewer_assertions"

[[rule]]
id = "I-04"
title = "Expected values change for a reason"
kind = "integrity"
check = "changed_expectation"
fix = "If the old value was right, fix the code; if it was wrong, say so in the change."

[[rule]]
id = "I-05"
title = "The coverage bar does not move down"
kind = "integrity"
check = "loosened_threshold"
action = "block"
